  /transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: Get paginated list of transactions with optional filters
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
        - name: startDate
          in: query
          schema:
            type: integer
            format: int64
          description: Start date filter (epoch milliseconds)
        - name: endDate
          in: query
          schema:
            type: integer
            format: int64
          description: End date filter (epoch milliseconds)
        - name: accountId
          in: query
          schema:
            type: integer
            format: int64
        - name: accountGroupId
          in: query
          schema:
            type: integer
            format: int64
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            type: string
            enum: [INCOME, EXPENSE, TRANSFER]
      responses:
        '200':
          description: Transactions retrieved
          content:
            application/json:
              schema:
