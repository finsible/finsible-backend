openapi: 3.0.3
info:
  title: Finsible - Personal Finance Management API
  description: |
    RESTful API for personal finance management including transaction tracking,
    account management, categorization, and multi-currency support.
    
    ## Authentication
    
    All endpoints except authentication endpoints require a valid JWT token.
    
    - **Web clients**: JWT is stored in an HttpOnly cookie
    - **Mobile clients**: JWT is returned in the response body and should be sent via Authorization header
    
    ## Response Format
    
    All responses follow a standard format:
    ```json
    {
      "message": "Description",
      "success": true/false,
      "timestamp": "2025-01-31 12:00:00",
      "data": { ... }
    }
    ```
  version: 0.0.1-SNAPSHOT
  contact:
    name: Finsible Support
    email: maitrymakwana196@gmail.com

servers:
  - url: http://localhost:9090
    description: Development server
  - url: https://api.finsible.org
    description: Production server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Accounts
    description: Financial account management
  - name: Account Groups
    description: Account type groupings
  - name: Transactions
    description: Income, expense, and transfer transactions
  - name: Categories
    description: Transaction categorization
  - name: Currencies
    description: Supported currencies management
  - name: Languages
    description: Supported languages management

paths:
  /auth/sign-in/google:
    post:
      tags:
        - Authentication
      summary: Sign in with Google ID token
      description: Authenticate using a Google ID token obtained from Google Sign-In
      parameters:
        - name: deviceType
          in: query
          required: true
          schema:
            type: string
            enum: [web, mobile]
          description: Client device type (determines token delivery method)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthenticationRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sign-in/google-code:
    post:
      tags:
        - Authentication
      summary: Sign in with Google authorization code
      description: Authenticate using a Google authorization code (OAuth flow)
      parameters:
        - name: deviceType
          in: query
          required: true
          schema:
            type: string
            enum: [web, mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthenticationRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: deviceType
          in: query
          required: false
          schema:
            type: string
            enum: [web, mobile]
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sign-out:
    post:
      tags:
        - Authentication
      summary: Sign out
      description: Sign out the current user and clear authentication
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: deviceType
          in: query
          required: true
          schema:
            type: string
            enum: [web, mobile]
      responses:
        '200':
          description: Successfully signed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /accounts:
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: Get all accounts for the authenticated user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountGroupId}:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Create a new account under the specified account group
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: accountGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the account group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}:
    put:
      tags:
        - Accounts
      summary: Update an account
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
    delete:
      tags:
        - Accounts
      summary: Delete an account
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

