  /supported-languages/{code}:
    get:
      tags:
        - Languages
      summary: Get language by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Language retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageResponse'

  /supported-languages/{id}:
    delete:
      tags:
        - Languages
      summary: Remove a supported language (Admin only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Language removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token in Authorization header
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
      description: JWT token in HttpOnly cookie

  schemas:
    BaseResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean
        timestamp:
          type: string
        data:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        referenceId:
          type: string

    UserAuthenticationRequest:
      type: object
      properties:
        token:
          type: string
          description: Google ID token (for token-based auth)
        code:
          type: string
          description: Google auth code (for code-based auth)
        clientId:
          type: string
          description: Google OAuth client ID
        defaultCurrencyCode:
          type: string
          minLength: 3
          maxLength: 3
          example: INR
        defaultLanguageCode:
          type: string
          example: en
      required:
        - clientId
        - defaultCurrencyCode
        - defaultLanguageCode

    UserResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserData'

    UserData:
      type: object
      properties:
        isNewUser:
          type: boolean
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        picture:
          type: string
          format: uri
        accountCreated:
          type: string
          format: date-time
        lastLoggedIn:
          type: string
          format: date-time
        jwt:
          type: string
          description: JWT token (only for mobile clients)
        defaultCurrencyCode:
          type: string
        defaultCurrencySymbol:
          type: string
        defaultLanguageCode:
          type: string

    AccountRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 255
        icon:
          type: string
          maxLength: 255
        balance:
          type: number
          format: decimal
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        isActive:
          type: boolean
        isSystemDefault:
          type: boolean

    AccountResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AccountData'

    AccountData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        balance:
          type: string
        accountGroupId:
          type: integer
          format: int64
        icon:
          type: string
        currencyCode:
          type: string
        isActive:
          type: boolean
        isSystemDefault:
          type: boolean
        creditLimit:
          type: string
        availableCredit:
          type: string
        billingDate:
          type: integer
        dueDate:
          type: integer
        autoPayEnabled:
          type: boolean
        autoPayFromAccountId:
          type: integer
          format: int64
        linkedBankAccountId:
          type: integer
          format: int64

    AccountListResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccountData'

    CreditCardAccountRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/AccountRequest'
        - type: object
          properties:
            creditLimit:
              type: number
              format: decimal
            availableCredit:
              type: number
              format: decimal
            billingDate:
              type: integer
              minimum: 1
              maximum: 31
            dueDate:
              type: integer
              minimum: 1
              maximum: 31
            autoPayEnabled:
              type: boolean
            autoPayFromAccountId:
              type: integer
              format: int64

    DebitCardAccountRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/AccountRequest'
        - type: object
          properties:
            linkedBankAccountId:
              type: integer
              format: int64
          required:
            - linkedBankAccountId

    AccountGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
